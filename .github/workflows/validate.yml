name: Validate skill packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Talia-orchestator/talia-store
          path: .ci/talia-store
      - uses: actions/checkout@v4
        with:
          repository: Talia-orchestator/talia-agents
          path: .ci/talia-agents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          TALIA_CATALOG_PACKER: ${{ github.workspace }}/.ci/talia-store/tools/talia-catalog-pack.cjs
          TALIA_AGENTS_ROOT: ${{ github.workspace }}/.ci/talia-agents
